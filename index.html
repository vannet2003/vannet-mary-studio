<!doctype html>
<html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VanNet ❤️ Mary Studio</title>
<style>
:root{color-scheme:dark;--bg:#17110e;--card:#261c16;--line:#62482e;--gold:#e8c276;--text:#fff3df;--muted:#c7b49a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#160e0b,#302018);color:var(--text);font:16px system-ui,'Noto Sans Khmer',sans-serif;padding:16px}
main{max-width:760px;margin:auto}.hero{text-align:center;padding:18px 5px}.hero h1{color:var(--gold);font-size:27px;margin:0}.hero p,.hint{color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:13px 0}h2{font-size:17px;color:var(--gold);margin:0 0 12px}
label{display:block;font-size:14px;font-weight:650;margin:12px 0 6px}input,textarea,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#17110e;color:var(--text);font:inherit}textarea{min-height:76px}
button{padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#38291e;color:var(--text);font-weight:650;cursor:pointer}.primary{background:linear-gradient(120deg,#a86e31,#e7c16d);color:#21150d;border:0;width:100%;font-size:15px}
.upload{display:block;text-align:center;padding:23px;border:2px dashed #987344;border-radius:12px;cursor:pointer}#preview{display:block;max-width:100%;max-height:340px;margin:12px auto 0;border-radius:10px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice.active{outline:2px solid var(--gold);background:#604323}.result{white-space:pre-wrap;background:#17110e;border-radius:10px;padding:12px;font-size:14px;line-height:1.7}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}
</style></head><body><main>
<header class="hero"><h1>VanNet ❤️ Mary Studio</h1><p>Chinese Poster → Khmer Translation → Khmer Poster Design</p></header>
<section class="card"><h2>① ដាក់ Poster រឿងចិន</h2><label class="upload" for="file">📤 ចុចដើម្បី Upload Poster</label><input id="file" class="hidden" type="file" accept="image/png,image/jpeg,image/webp"><div id="fname" class="hint">មិនទាន់មានរូបភាព</div><img id="preview" class="hidden" alt="Poster preview"><button id="translate" class="primary" style="margin-top:12px">🌏 Gemini AI អាន និងបកប្រែជាខ្មែរ</button><div id="status" class="hint" role="status" style="margin-top:9px"></div></section>
<section class="card"><h2>② ពិនិត្យ និងកែចំណងជើងខ្មែរ</h2><label>ចំណងជើងចិនដែល AI អានបាន</label><input id="zh" placeholder="AI នឹងបង្ហាញអក្សរចិននៅទីនេះ"><label>ចំណងជើងខ្មែរ (ប្អូនអាចកែបាន)</label><textarea id="kh" placeholder="AI នឹងដាក់ចំណងជើងខ្មែរនៅទីនេះ"></textarea><label>អត្ថន័យតាមពាក្យ</label><div id="literal" class="result hint">មិនទាន់មានលទ្ធផល</div><label>ចំណងជើងជម្រើស</label><div id="alts" class="row"></div><div id="notes" class="hint"></div></section>
<section class="card"><h2>③ ជ្រើសរើសស្ទាយអក្សរ និងស៊ុម</h2><div class="grid" id="styles">
<button class="choice active" data-style="Royal antique gold 3D Khmer calligraphy, deep crimson outline, imperial engraving">👑 មាសរាជវង្ស</button>
<button class="choice" data-style="Elegant traditional Khmer calligraphy, brushed antique gold, delicate curves">✒️ អក្សរខ្មែរបុរាណ</button>
<button class="choice" data-style="Bold cinematic 3D gold lettering, deep red extrusion and dramatic shadows">🔥 មាស 3D ដិត</button>
<button class="choice" data-style="Romantic rose gold Khmer lettering, soft golden glow and elegant flourishes">🌹 រ៉ូមែនទិក</button>
<button class="choice" data-style="Black lacquer and gold engraved Khmer lettering, powerful royal aesthetic">🏯 ខ្មៅមាសអធិរាជ</button>
<button class="choice" data-style="Premium modern Khmer display typography with gold chrome finish">✨ មាសទំនើប</button></div>
<label>ស៊ុម</label><select id="frame"><option>នាគមាស និងពពកបុរាណ</option><option>ស៊ុមរាជវង្សមាស</option><option>ផ្កា និងសូត្រក្រហម</option><option>ស៊ុមឆ្លាក់មាស</option><option>ស៊ុមមាសសាមញ្ញ</option><option>គ្មានស៊ុម</option></select>
<label>ពណ៌អក្សរ</label><select id="color"><option>មាសចាស់ + គែមក្រហម</option><option>មាសស្រាល + ស្រមោលត្នោត</option><option>Rose Gold</option><option>ប្រាក់ + គែមក្រហម</option><option>មាសស្រាល + ស្រមោលខ្មៅ</option></select>
<label>ទីតាំងចំណងជើង</label><select id="place"><option>ខាងក្រោម កណ្ដាល</option><option>ពាក់កណ្ដាលខាងក្រោម ធំៗ</option><option>ខាងលើ កណ្ដាល</option><option>ទីតាំងដើម</option></select>
<label>កំណត់ចំណាំបន្ថែម</label><textarea id="notes2" placeholder="ឧ. រក្សាមុខតួសម្ដែងដដែល មិនបាំងមុខតួ..."></textarea></section>
<button class="primary" id="make">✨ បង្កើត Prompt សម្រាប់ Google Flow</button>
<section class="card hidden" id="out"><h2>Prompt របស់ប្អូន</h2><textarea id="prompt" style="min-height:330px"></textarea><button class="primary" id="copy" style="margin-top:10px">📋 Copy Prompt</button></section>
<p class="hint">សុវត្ថិភាព៖ Gemini API Key រក្សាទុកនៅ Server មិនដាក់ក្នុង Browser ទេ។</p>
</main><script>
let image=null,style='Royal antique gold 3D Khmer calligraphy, deep crimson outline, imperial engraving';
const $=id=>document.getElementById(id);
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)){alert('សូមប្រើ PNG, JPG ឬ WEBP');return}if(f.size>10*1024*1024){alert('សូមប្រើរូបភាពតូចជាង 10MB');return}image={mimeType:f.type,base64:await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(f)})};$('preview').src=URL.createObjectURL(f);$('preview').classList.remove('hidden');$('fname').textContent=f.name};
$('translate').onclick=async()=>{if(!image){$('status').textContent='សូម Upload Poster ជាមុនសិន។';return}$('translate').disabled=true;$('status').textContent='កំពុងឱ្យ Gemini អានអក្សរចិន និងបកប្រែ...';try{const r=await fetch('/api/translate-poster',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageBase64:image.base64,mimeType:image.mimeType})});const d=await r.json();if(!r.ok)throw new Error(d.error||'API error');$('zh').value=d.chinese_title||'';$('kh').value=d.khmer_title||'';$('literal').textContent=d.literal_meaning||'';$('notes').textContent=d.notes||'';$('alts').innerHTML='';(d.alternatives||[]).forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{$('kh').value=t};$('alts').appendChild(b)});$('status').textContent='បានបកប្រែរួច! សូមពិនិត្យ និងកែចំណងជើងខ្មែរមុនបន្ត។'}catch(e){$('status').textContent='មានបញ្ហា៖ '+e.message}finally{$('translate').disabled=false}};
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-style]').forEach(x=>x.classList.remove('active'));b.classList.add('active');style=b.dataset.style});
$('make').onclick=()=>{const kh=$('kh').value.trim();if(!kh){alert('សូមបញ្ចូល ឬកែចំណងជើងខ្មែរជាមុន');return}const p=`Edit the uploaded original Chinese drama poster into a professional Khmer-localized cinematic poster.\n\nEXACT KHMER TITLE:\n${kh}\n\nORIGINAL CHINESE TITLE:\n${$('zh').value||'Read from uploaded image if needed'}\n\nTYPOGRAPHY STYLE:\n${style}\nTITLE COLOR: ${$('color').value}\nFRAME: ${$('frame').value}\nTITLE PLACEMENT: ${$('place').value}\nADDITIONAL NOTES: ${$('notes2').value||'Keep title large and readable.'}\n\nIMPORTANT: Use the Khmer title exactly as supplied. Do not translate again, rewrite, omit or invent Khmer characters. Preserve actors, faces, costumes, poses, lighting and original composition. Do not cover faces. Create a premium, beautiful Khmer historical Chinese drama poster. If exact Khmer rendering is unreliable, leave a clean title area rather than misspelled text.`;$('prompt').value=p;$('out').classList.remove('hidden');$('out').scrollIntoView({behavior:'smooth'})};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('prompt').value);alert('បាន Copy Prompt!')}catch(e){$('prompt').select();alert('សូម Copy ដោយដៃ។')}};
</script></body></html>
